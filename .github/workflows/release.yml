name: Release

on:
  push:
    tags:
      - 'v*'
    branches: [main]
    paths:
      - 'Makefile'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve version and tag
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"
            echo "mode=tag" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(grep -E '^VERSION \?=' Makefile | sed -E 's/^VERSION \?= *//')
            TAG="v${VERSION}"
            if ! git diff HEAD^ HEAD -- Makefile | grep -qE '^[-+]VERSION \?='; then
              echo "Makefile VERSION line not changed, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if git ls-remote --tags origin | grep -q "refs/tags/${TAG}$"; then
              echo "Tag ${TAG} already exists, skipping"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=bump" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.skip != 'true'
        with:
          go-version: '1.25'

      - name: Build binary
        if: steps.ver.outputs.skip != 'true'
        run: |
          CGO_ENABLED=1 GOARCH=amd64 go build \
            -ldflags "-X main.version=${{ steps.ver.outputs.version }}" \
            -o vocala ./cmd/server/

      - name: Install nfpm
        if: steps.ver.outputs.skip != 'true'
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      - name: Sync nfpm version
        if: steps.ver.outputs.skip != 'true'
        run: sed -i "s/^version:.*/version: v${{ steps.ver.outputs.version }}/" nfpm.yaml

      - name: Build deb and rpm
        if: steps.ver.outputs.skip != 'true'
        run: |
          mkdir -p dist
          nfpm package --packager deb --target dist/
          nfpm package --packager rpm --target dist/

      - name: Create tag if bump
        if: steps.ver.outputs.skip != 'true' && steps.ver.outputs.mode == 'bump'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Release ${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.ver.outputs.skip != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.rpm
            vocala
