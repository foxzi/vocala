name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Build
        run: CGO_ENABLED=1 go build -ldflags "-X main.version=dev" -o vocala ./cmd/server/

      - name: Vet
        run: go vet ./...

      - name: Install nfpm
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@latest

      # Catch nfpm.yaml pointing at removed files before a release breaks
      - name: Package check
        run: |
          mkdir -p dist
          nfpm package --packager deb --target dist/
          nfpm package --packager rpm --target dist/
